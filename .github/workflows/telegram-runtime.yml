name: Telegram Bot Runtime (GitHub Actions)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-runtime
  cancel-in-progress: true

jobs:
  run-bot:
    # Based on the Windows runtime pattern from siasoltoon/vps, but without
    # hardcoded credentials or unsafe RDP settings.
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      SELF_BOT_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: sqlite:///./data/selfbot.db
      DATABASE_ECHO: "false"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      PC_WORKER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Prepare database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          alembic upgrade head

      - name: Start Telegram bot
        shell: pwsh
        run: |
          python scripts/run_bot.py
