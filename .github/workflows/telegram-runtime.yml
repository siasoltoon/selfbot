name: Telegram Bot Runtime (GitHub Actions)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-runtime
  cancel-in-progress: true

jobs:
  run-bot:
    # Based on the Windows runtime pattern from siasoltoon/vps, but without
    # hardcoded credentials or unsafe RDP settings.
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      SELF_BOT_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ECHO: "false"
      DATABASE_CONNECT_RETRIES: "3"
      DATABASE_CONNECT_RETRY_DELAY: "1.0"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_SESSION_IS_STRING: "true"
      TELEGRAM_ONBOARDING_BOT_TOKEN: ${{ secrets.TELEGRAM_ONBOARDING_BOT_TOKEN }}
      TELEGRAM_SESSION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SESSION_ENCRYPTION_KEY }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      PC_WORKER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install SQL Server ODBC driver
        shell: pwsh
        run: |
          winget install --exact --id Microsoft.msodbcsql.18 --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
          $driver = Get-OdbcDriver -Name "ODBC Driver 18 for SQL Server" -ErrorAction SilentlyContinue
          if (-not $driver) {
            throw "Microsoft ODBC Driver 18 for SQL Server is not installed or not registered."
          }
          Write-Host "SQL Server ODBC driver: $($driver.Name) $($driver.Version)"

      - name: Connect GitHub runner to Tailscale
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: 100.114.8.105

      - name: Diagnose Tailscale and SQL TCP path
        shell: pwsh
        run: |
          $target = "100.114.8.105"
          $port = 1433

          Write-Host "=== Runner network identity ==="
          Get-NetIPConfiguration |
            Where-Object { $_.IPv4Address } |
            ForEach-Object {
              $addresses = ($_.IPv4Address | ForEach-Object { $_.IPv4Address }) -join ", "
              Write-Host "Interface=$($_.InterfaceAlias) IPv4=$addresses"
            }

          Write-Host "=== Tailscale client state ==="
          $tailscale = Get-Command tailscale -ErrorAction SilentlyContinue
          if ($tailscale) {
            tailscale version
            tailscale status
          } else {
            Write-Warning "tailscale CLI was not found on PATH; continuing with native Windows diagnostics."
          }

          Write-Host "=== Route to SQL host ==="
          Get-NetRoute -DestinationPrefix "$target/32" -ErrorAction SilentlyContinue |
            Format-Table -AutoSize

          Write-Host "=== ICMP reachability ==="
          $ping = Test-Connection -ComputerName $target -Count 3 -Quiet -ErrorAction SilentlyContinue
          Write-Host "PingSuccess=$ping"

          Write-Host "=== TCP 1433 reachability (5 attempts) ==="
          $tcpResults = @()
          for ($i = 1; $i -le 5; $i++) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $result = Test-NetConnection -ComputerName $target -Port $port -InformationLevel Detailed -WarningAction SilentlyContinue
            $sw.Stop()
            $tcpResults += [pscustomobject]@{
              Attempt = $i
              TcpTestSucceeded = $result.TcpTestSucceeded
              RemoteAddress = $result.RemoteAddress
              RemotePort = $result.RemotePort
              SourceAddress = $result.SourceAddress
              PingSucceeded = $result.PingSucceeded
              ElapsedMs = $sw.ElapsedMilliseconds
            }
          }
          $tcpResults | Format-Table -AutoSize
          if (-not ($tcpResults.TcpTestSucceeded -contains $true)) {
            throw "DIAGNOSTIC FAILURE: TCP $port is unreachable at $target from the GitHub runner."
          }

      - name: Install runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mssql]"

      - name: Resolve database configuration
        shell: pwsh
        run: |
          if (-not "${{ secrets.DATABASE_URL }}") {
            "DATABASE_URL=sqlite:///./data/selfbot.db" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "DATABASE_URL secret is absent; using ephemeral SQLite for this runtime only."
          } else {
            "DATABASE_URL=${{ secrets.DATABASE_URL }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Diagnose SQL Server authentication and query path
        shell: pwsh
        run: |
          python -c @'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          raw_url = os.environ["DATABASE_URL"]
          url = make_url(raw_url)
          print(f"DATABASE_URL target: {url.render_as_string(hide_password=True)}")

          engine = create_engine(raw_url, pool_pre_ping=True, connect_args={"timeout": 15})
          try:
              with engine.connect() as connection:
                  row = connection.execute(
                      text("SELECT @@SERVERNAME AS server_name, DB_NAME() AS database_name")
                  ).mappings().one()
                  print(
                      "SQL_DIAGNOSTIC_PASS "
                      f"server={row['server_name']} database={row['database_name']}"
                  )
          finally:
              engine.dispose()
          '@

      - name: Prepare database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          alembic upgrade head

      - name: Start Telegram bot
        shell: pwsh
        run: |
          python scripts/run_bot.py
