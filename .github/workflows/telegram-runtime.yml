name: Telegram Bot Runtime (GitHub Actions)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-bot-runtime
  cancel-in-progress: true

jobs:
  run-bot:
    # Based on the Windows runtime pattern from siasoltoon/vps, but without
    # hardcoded credentials or unsafe RDP settings.
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      SELF_BOT_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ECHO: "false"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_SESSION_IS_STRING: "true"
      TELEGRAM_ONBOARDING_BOT_TOKEN: ${{ secrets.TELEGRAM_ONBOARDING_BOT_TOKEN }}
      TELEGRAM_SESSION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SESSION_ENCRYPTION_KEY }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      PC_WORKER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[mssql]"

      - name: Ensure SQL Server ODBC driver
        shell: pwsh
        run: |
          $driver = Get-OdbcDriver -Name "ODBC Driver 18 for SQL Server" -ErrorAction SilentlyContinue
          if (-not $driver) {
            Write-Host "ODBC Driver 18 for SQL Server is not installed; installing via WinGet."
            winget install --exact --id Microsoft.msodbcsql.18 --source winget --silent --accept-package-agreements --accept-source-agreements
          }

          $driver = Get-OdbcDriver -Name "ODBC Driver 18 for SQL Server" -ErrorAction SilentlyContinue
          if (-not $driver) {
            Write-Error "ODBC Driver 18 for SQL Server is unavailable after installation."
            exit 1
          }
          Write-Host "Found ODBC Driver 18 for SQL Server."

      - name: Connect to private tailnet
        if: vars.TAILSCALE_ENABLED == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:selfbot-ci
          ping: ${{ vars.SELFBOT_DATABASE_TAILSCALE_HOST }}

      - name: Verify private SQL Server TCP reachability
        if: vars.TAILSCALE_ENABLED == 'true'
        shell: pwsh
        run: |
          $hostName = "${{ vars.SELFBOT_DATABASE_TAILSCALE_HOST }}"
          $result = Test-NetConnection -ComputerName $hostName -Port 1433 -InformationLevel Quiet
          if (-not $result) {
            Write-Error "Cannot reach SQL Server over the private network."
            exit 1
          }
          Write-Host "SQL Server TCP 1433 is reachable."

      - name: Resolve database configuration
        shell: pwsh
        run: |
          $databaseUrl = "${{ secrets.DATABASE_URL }}"
          if ("${{ vars.TAILSCALE_ENABLED }}" -eq "true" -and [string]::IsNullOrWhiteSpace($databaseUrl)) {
            Write-Error "DATABASE_URL is required when TAILSCALE_ENABLED=true."
            exit 1
          }

          if ([string]::IsNullOrWhiteSpace($databaseUrl)) {
            "DATABASE_URL=sqlite:///./data/selfbot.db" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "DATABASE_URL secret is absent; using ephemeral SQLite for this runtime only."
          } else {
            "DATABASE_URL=$databaseUrl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Prepare database
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          alembic upgrade head

      - name: Start Telegram bot
        shell: pwsh
        run: |
          python scripts/run_bot.py
