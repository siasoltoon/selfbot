name: Telegram Bot Runtime (GitHub Actions)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-bot-runtime
  cancel-in-progress: true

jobs:
  run-bot:
    # Deployment-neutral runtime. Durable PostgreSQL is supplied through DATABASE_URL.
    runs-on: windows-latest
    timeout-minutes: 350

    env:
      SELF_BOT_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_ECHO: "false"
      DATABASE_CONNECT_RETRIES: "3"
      DATABASE_CONNECT_RETRY_DELAY: "1.0"
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_SESSION_IS_STRING: "true"
      TELEGRAM_ONBOARDING_BOT_TOKEN: ${{ secrets.TELEGRAM_ONBOARDING_BOT_TOKEN }}
      TELEGRAM_SESSION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SESSION_ENCRYPTION_KEY }}
      OWNER_ID: ${{ secrets.OWNER_ID }}
      PC_WORKER_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[postgres]"

      - name: Validate durable database configuration
        shell: pwsh
        run: |
          if (-not "${{ secrets.DATABASE_URL }}") {
            throw "DATABASE_URL GitHub secret is required for the production runtime."
          }

      - name: Diagnose PostgreSQL authentication and query path
        shell: pwsh
        run: |
          python -c @'
          import os
          from sqlalchemy import create_engine, text
          from sqlalchemy.engine import make_url

          raw_url = os.environ["DATABASE_URL"]
          url = make_url(raw_url)
          if url.drivername not in {"postgresql", "postgresql+psycopg"}:
              raise SystemExit(
                  f"DATABASE_URL must target PostgreSQL for this runtime; got {url.drivername!r}"
              )

          print(f"DATABASE_URL target: {url.render_as_string(hide_password=True)}")

          engine = create_engine(
              raw_url,
              pool_pre_ping=True,
              connect_args={"connect_timeout": 15},
          )
          try:
              with engine.connect() as connection:
                  row = connection.execute(
                      text(
                          "SELECT current_database() AS database_name, "
                          "current_user AS database_user"
                      )
                  ).mappings().one()
                  print(
                      "POSTGRES_DIAGNOSTIC_PASS "
                      f"database={row['database_name']} user={row['database_user']}"
                  )
          finally:
              engine.dispose()
          '@

      - name: Prepare database
        shell: pwsh
        run: |
          alembic upgrade head

      - name: Start Telegram bot
        shell: pwsh
        run: |
          python scripts/run_bot.py
