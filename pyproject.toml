[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-personal-ai-os"
version = "0.1.0"
description = "Modular Telegram Personal AI Operating System"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "SQLAlchemy>=2,<3",
    "alembic>=1.13,<2",
    "croniter>=3,<7",
    "telethon>=1.36,<2",
    "cryptography>=42,<47",
    "qrcode[pil]>=8,<9",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
test = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
