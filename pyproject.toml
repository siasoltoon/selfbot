[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-personal-ai-os"
version = "0.1.0"
description = "Modular Telegram Personal AI Operating System"
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]
